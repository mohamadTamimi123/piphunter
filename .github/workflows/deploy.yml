name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # یا هر شاخه‌ای که می‌خواهید روی آن دپلی کنید

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port : ${{ secrets.PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/html/myproject
            rsync -avz ./ /var/www/html/myproject/
            # دستورات اضافی برای نصب وابستگی ها و یا اجرای پروژه می تواند اینجا اضافه شود
            # مثلا:
            # cd /var/www/html/myproject
            # sudo apt-get update && sudo apt-get install -y nodejs npm  (برای نصب nodejs و npm)
            # npm install  (برای نصب وابستگی های پروژه)
            # sudo systemctl restart nginx # یا هر سرویس دیگری که پروژه شما از آن استفاده می‌کند.

